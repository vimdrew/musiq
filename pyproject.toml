[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "musiq"
version = "0.3.0"
description = "Download music from Spotify to MP3 — pure yt-dlp + eyeD3 + iTunes API"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026",
    "ytmusicapi>=1.12",
    "eyed3>=0.9",
    "rapidfuzz>=3",
    "requests>=2",
    "beautifulsoup4>=4",
    "rich>=13",
    "click>=8",
    "pillow>=10",
]

[project.scripts]
musiq = "musiq.cli:cli"

[tool.setuptools.packages.find]
include = ["musiq*"]
